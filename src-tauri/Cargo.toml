[package]
name = "rabbit-tool"
version = "0.2.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
lapin = { version = "2", default-features = false, features = ["native-tls"] }
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
urlencoding = "2"
futures-lite = "2"
log = "0.4"
tauri-plugin-log = "2"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = true
codegen-units = 1
strip = true
